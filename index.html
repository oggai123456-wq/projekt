<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <script src="logic.js" defer></script>
</head>
<body>

    <h1>🍪 Cookie clicker remake 🍪</h1>
    <h4>made by ogusbogus & alejandro</h4>

    <div class="main-grid">
        <div class="left-container">
            <button id = "CookieButton"><p class="CookieB">🍪</p></button>
            <h1 id = "Score">Cash: </h1>
            <button id = "Rebirth"><p>📈 Rebirth</p></button>

            <h2 id = "status"></h2>
        </div>

        <div class="right-container">
            <h2 id = "CashMulti">💸 Cash Multiplier: </h2>

            <h2 id = "UpgradesText">🛒 Upgrades</h2>
            <div class="upgrade-container">
                <button id = "upgrade1"> <p>💰 More sell price: 10</p>
                    <p class="description">You can now sell cookies for a higher price!</p>
                </button>

                <button id = "upgrade2"> <p>🏷️ Cheaper groceries: 25</p>
                    <p class="description">You can now buy groceries for a cheaper price...more profit!</p>
                </button>

                <button id = "upgrade3"> <p>🔥 Industrial oven</p>
                    <p class="description">Bigger oven means more cookies being baked...even more profi!</p>
                </button>
            </div>
            

        </div>
    </div>
</body>
</html>
